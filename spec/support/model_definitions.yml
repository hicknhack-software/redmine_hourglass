time_tracker_start:
  title: Time Tracker Start
  type: object
  properties:
    issue_id:
      type: integer
      minimum: 0
    comments:
      type: string
time_tracker:
  title: Time Tracker
  type: object
  properties:
    id:
      type: integer
      minimum: 0
    start:
      type: string
      format: date-time
    user_id:
      type: integer
      minimum: 0
    project_id:
      type: integer
      minimum: 0
      nullable: true
    activity_id:
      type: integer
      minimum: 0
      nullable: true
    issue_id:
      type: integer
      minimum: 0
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

time_tracker_update:
  title: Time Tracker Update
  type: object
  properties:
    start:
      type: string
      format: date-time
    user_id:
      type: integer
      minimum: 0
    project_id:
      type: integer
      minimum: 0
    activity_id:
      type: integer
      minimum: 0
    issue_id:
      type: integer
      minimum: 0
    comments:
      type: string
time_log:
  title: Time Log
  type: object
  properties:
    id:
      type: integer
      minimum: 0
    start:
      type: string
      format: date-time
    stop:
      type: string
      format: date-time
    hours:
      type: number
      minimum: 0
    comments:
      type: string
    user_id:
      type: integer
      minimum: 0
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
time_log_update:
  title: Time Log Update
  type: object
  properties:
    start:
      type: string
      format: date-time
    stop:
      type: string
      format: date-time
    comments:
      type: string
time_booking:
  title: Time Booking
  type: object
  properties:
    id:
      type: integer
      minimum: 0
    start:
      type: string
      format: date-time
    stop:
      type: string
      format: date-time
    time_log_id:
      type: integer
      minimum: 0
    time_entry_id:
      type: integer
      minimum: 0
    time_entry:
      $ref: '#/components/schemas/time_entry'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
time_entry:
  title: Time Entry
  type: object
  properties:
    id:
      type: integer
      minimum: 0
    author_id:
      type: integer
      minimum: 0
    user_id:
      type: integer
      minimum: 0
    project_id:
      type: integer
      minimum: 0
      nullable: true
    issue_id:
      type: integer
      minimum: 0
      nullable: true
    hours:
      type: string
    activity_id:
      type: integer
      minimum: 0
    comments:
      type: string
      nullable: true
    spent_on:
      type: string
      format: date
    tyear:
      type: integer
    tmonth:
      type: integer
    tweek:
      type: integer
    created_on:
      type: string
      format: date-time
    updated_on:
      type: string
      format: date-time
time_booking_params:
  title: Time Booking Params
  type: object
  properties:
    start:
      type: string
      format: date-time
    stop:
      type: string
      format: date-time
    user_id:
      type: integer
      minimum: 0
    project_id:
      type: integer
      minimum: 0
    activity_id:
      type: integer
      minimum: 0
    issue_id:
      type: integer
      minimum: 0
    comments:
      type: string
error_msg:
  title: Error
  type: object
  properties:
    message:
      type: string
time_tracker_index_response:
  title: Time Tracker Index
  type: object
  properties:
    count:
      type: integer
    offset:
      type: integer
    limit:
      type: integer
    records:
      type: array
      items:
        "$ref": "#/components/schemas/time_tracker"
time_log_index_response:
  title: Time Log Index
  type: object
  properties:
    count:
      type: integer
    offset:
      type: integer
    limit:
      type: integer
    records:
      type: array
      items:
        "$ref": "#/components/schemas/time_log"
time_booking_index_response:
  title: Time Booking Index
  type: object
  properties:
    count:
      type: integer
    offset:
      type: integer
    limit:
      type: integer
    records:
      type: array
      items:
        "$ref": "#/components/schemas/time_booking"
